name: Build and publish the site to the droplet

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build
      - name: Deploy to Droplet
        uses: burnett01/rsync-deployment@v9
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /var/www/new
          remote_host: ${{ secrets.DROPLET_HOST }}
          remote_user: ${{ secrets.DROPLET_USER }}
          remote_key: ${{ secrets.MAIN_KEY }}
