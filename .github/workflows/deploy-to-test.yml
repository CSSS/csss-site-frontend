name: Build and publish the site to the test branch

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: deploy-test-branch
  cancel-in-progress: false

jobs:
  deploy-to-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out the merged develop branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check Astro and MDX
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Publish dist to the remote test branch
        env:
          COMMIT_MESSAGE: >-
            Deploy PR #${{ github.event.pull_request.number }}:
            ${{ github.event.pull_request.title }}
        run: |
          git fetch origin test
          git worktree add --force ../test-output origin/test
          cd ../test-output
          git rm -rf .
          cp -a "$GITHUB_WORKSPACE/dist/." .
          git add --all

          if git diff --cached --quiet; then
            echo "Test output is unchanged; nothing to publish."
            exit 0
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:test
